# Local development database only (T-103). The app runs on the host with `pnpm dev`.
# Production-like compose is docker-compose.yml (raj). Postgres major = production (17, raj T-501).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admmis
      POSTGRES_PASSWORD: admmis # local dev only; never reuse outside this machine
      POSTGRES_DB: admmis_tech
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - admmis-tech-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admmis -d admmis_tech']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  admmis-tech-db:
